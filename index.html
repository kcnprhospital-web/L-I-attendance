<style>
:root{
  --blue:#032EA1; --blue-dk:#02206f; --ink:#14213d; --muted:#5b6780;
  --bg:#eef2f8; --paper:#fff; --line:#cfd8e6; --red:#c8102e; --green:#1a7f4b; --amber:#a86400;
  --body:'Kantumruy Pro','Noto Sans Khmer','Khmer OS Siemreap','Segoe UI',system-ui,sans-serif;
  --title:'Moul','Khmer OS Muol Light','Kantumruy Pro',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffb81c;outline-offset:2px}

/* masthead */
.mast{background:var(--blue);color:#fff;border-bottom:6px solid var(--red)}
.mast-in{max-width:1080px;margin:0 auto;padding:18px 16px 16px;display:flex;gap:16px;align-items:flex-start}
.emblem{flex:none;width:76px;height:76px;border-radius:50%;background:#fff;padding:3px}
.emblem img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.mast h1{font-family:var(--title);font-weight:400;font-size:clamp(17px,3.6vw,24px);line-height:1.9;margin:0}
.mast .en-title{font-weight:600;font-size:clamp(14px,2.6vw,17px);margin:2px 0 6px}
.mast p{margin:0;font-size:14px;opacity:.92}
.mast-txt{flex:1;min-width:0}
.lang{flex:none;background:transparent;border:1.5px solid #fff;color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600}
.lang:hover{background:#fff;color:var(--blue)}
@media(max-width:560px){.emblem{width:56px;height:56px}}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
.tabs{display:flex;gap:0;margin:18px 0 0;border-bottom:2px solid var(--blue)}
.tab{flex:1;max-width:260px;background:#dfe6f3;border:0;border-radius:6px 6px 0 0;padding:12px 10px;font-weight:600;cursor:pointer;color:var(--blue-dk);margin-right:4px}
.tab[aria-selected="true"]{background:var(--blue);color:#fff}
.sync{font-size:13.5px;margin:10px 0 0;color:var(--muted)}
.sync.warn{color:var(--amber)}
.sync.ok{color:var(--green)}

.panel{background:var(--paper);border:1px solid var(--line);border-top:0;padding:20px 18px 24px}
.panel[hidden]{display:none}
h2{font-size:18px;margin:0 0 4px;font-weight:700}
h3{font-size:15.5px;margin:0 0 8px;font-weight:700}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}

.grid{display:grid;gap:14px 18px;grid-template-columns:1fr}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
.f label,.f .lab{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.req{color:var(--red)}
.f input[type=text],.f input[type=date],.f select,.f textarea,.filters input,.filters select,.dash-top select{
  width:100%;border:1.5px solid var(--line);border-radius:4px;padding:10px 11px;background:#fff;min-height:46px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
.note{font-size:13.5px;color:var(--amber);margin-top:4px}
.f input.locked{background:#eef2f8;color:var(--muted);pointer-events:none}
.datetxt{font-size:14px;font-weight:600;color:var(--blue);margin-top:4px}

/* participant groups as ruled ledger rows */
.cats{border:1.5px solid var(--blue);border-radius:4px;overflow:hidden}
.cats .cat{display:flex;align-items:center;gap:12px;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);margin:0;font-weight:500}
.cats .cat:last-child{border-bottom:0}
.cat input{position:absolute;opacity:0}
.cat .box{flex:none;width:24px;height:24px;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center}
.cat .km{font-weight:600;font-size:15.5px}
.cat .en{color:var(--muted);font-size:13.5px}
.cat:hover{background:#f3f6fc}
.cats .cat:has(input:checked){background:var(--blue);color:#fff}
.cat:has(input:checked) .en{color:#dbe4ff}
.cat:has(input:checked) .box{border-color:#fff;background:#fff}
.cat:has(input:checked) .box::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--red)}
.cat:has(input:focus-visible){outline:3px solid #ffb81c;outline-offset:-3px}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.f .seg label{margin:0;font-weight:500}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;border:1.5px solid var(--line);border-radius:4px;padding:8px 18px;cursor:pointer;background:#fff}
.seg input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid #ffb81c}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:46px}
.btn:hover{background:#eaf0fd}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dk)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13.5px}
.btn.del{border-color:var(--red);color:var(--red)}
.editbar{background:#fff6dc;border:1.5px solid #e2b93b;border-radius:4px;padding:9px 12px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
.editbar[hidden]{display:none}

.filters{display:grid;gap:10px 12px;grid-template-columns:1fr 1fr;margin-bottom:14px}
@media(min-width:820px){.filters{grid-template-columns:1.3fr 1fr 1fr 1.2fr 1.4fr}}
.filters label,.dash-top label{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}

.tally{width:100%;border-collapse:collapse;margin:4px 0 16px;table-layout:fixed}
.tally td{border:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:top}
.tally .n{font-size:26px;font-weight:700;line-height:1.2;color:var(--blue)}
.tally .l{font-size:12.5px;color:var(--muted);line-height:1.4}
.tally .d{font-size:12.5px;font-weight:600}
.tally .d.up{color:var(--green)}.tally .d.down{color:var(--red)}
.tally td.tot{background:var(--blue)}
.tally td.tot .n,.tally td.tot .l{color:#fff}
@media(max-width:600px){
  .tally,.tally tbody,.tally tr{display:grid;grid-template-columns:repeat(3,1fr)}
  .tally tbody,.tally tr{grid-column:1/-1}
  .tally.four,.tally.four tbody,.tally.four tr{grid-template-columns:repeat(2,1fr)}
}

/* dashboard */
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.dash-top>div:last-child{min-width:210px}
.chartbox{border:1px solid var(--line);padding:14px 14px 10px;margin-bottom:16px}
.chartbox .cv{position:relative;height:340px}
.chartbox .cv.short{height:300px}
.two{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.two{grid-template-columns:1fr 1.25fr}}
.two .chartbox{margin-bottom:0}

.scroll{overflow-x:auto;border:1px solid var(--line)}
table.list{width:100%;border-collapse:collapse;min-width:800px;font-size:14.5px}
.list th{background:#e4eaf6;text-align:left;padding:9px 8px;font-weight:700;border-bottom:2px solid var(--blue);white-space:nowrap}
.list td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.list tr.pending td{background:#fffaf0}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:10px 0 0}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:4px;max-width:92vw;z-index:50;font-weight:500}
.toast[hidden]{display:none}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:22px}

/* print / PDF report */
#printArea{display:none}
@media print{
  @page{size:A4 portrait;margin:14mm 12mm}
  body{background:#fff;font-size:11pt}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .pg{page-break-after:always}
  .pg:last-child{page-break-after:auto}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;text-align:center;font-family:var(--title);font-size:10.5pt;line-height:2}

<body>

<header class="mast">
  <div class="mast-in">
    <div class="emblem"><img id="logoImg" alt="Kampong Chhnang Provincial Hospital logo"></div>
    <div class="mast-txt">
      <h1>បញ្ជីវត្តមាន វគ្គសិក្សាភាពជាអ្នកដឹកនាំ និងនវានុវត្តន៍</h1>
      <div class="en-title">Leadership and Innovation Course: Attendance Register</div>
      <p data-i="mastSub"></p>
      <p id="hospName"></p>
    </div>
    <button class="lang" id="langBtn" type="button">EN</button>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabForm" aria-selected="true" data-i="tabForm"></button>
    <button class="tab" role="tab" id="tabDash" aria-selected="false" data-i="tabDash"></button>
    <button class="tab" role="tab" id="tabList" aria-selected="false" data-i="tabList"></button>
  </div>

  <!-- RECORD ATTENDANCE -->
  <section class="panel" id="panelForm">
    <div class="editbar" id="editBar" hidden>
      <span data-i="editing"></span>
      <button class="btn sm" type="button" id="cancelEdit" data-i="cancelEdit"></button>
    </div>
    <h2 data-i="formTitle"></h2>
    <p class="hint" data-i="formHint"></p>

    <form id="form" novalidate>
      <div class="grid">
        <div class="f">
          <label for="fDate"><span data-i="lDate"></span> <span class="req">*</span></label>
          <input type="date" id="fDate" required readonly tabindex="-1" class="locked">
          <div class="datetxt" id="dateTxt"></div>
          <div class="note" id="dateNote" hidden data-i="notTuesday"></div>
        </div>
        <div class="f">
          <label for="fName"><span data-i="lName"></span> <span class="req">*</span></label>
          <input type="text" id="fName" list="nameList" required autocomplete="off">
          <datalist id="nameList"></datalist>
        </div>
        <div class="f">
          <span class="lab" data-i="lSex"></span>
          <div class="seg">
            <label><input type="radio" name="sex" value="M"><span data-i="male"></span></label>
            <label><input type="radio" name="sex" value="F"><span data-i="female"></span></label>
          </div>
        </div>
        <div class="f">
          <label for="fDept"><span data-i="lDept"></span> <span class="req">*</span></label>
          <select id="fDept" required></select>
          <input type="text" id="fDeptOther" hidden style="margin-top:8px" aria-label="Other department">
        </div>
        <div class="f full">
          <span class="lab"><span data-i="lPart"></span> <span class="req">*</span></span>
          <div class="seg">
            <label><input type="radio" name="part" value="group"><span data-i="pGroup"></span></label>
            <label><input type="radio" name="part" value="personal"><span data-i="pPersonal"></span></label>
          </div>
        </div>
        <div class="f full">
          <span class="lab"><span data-i="lCat"></span> <span class="req">*</span></span>
          <div class="cats" id="cats" role="radiogroup"></div>
        </div>
        <div class="f full">
          <label for="fRemark" data-i="lRemark"></label>
          <textarea id="fRemark"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="btn pri" type="submit" id="saveBtn" data-i="save"></button>
        <button class="btn" type="button" id="clearBtn" data-i="clear"></button>
      </div>
    </form>
  </section>

  <!-- DASHBOARD -->
  <section class="panel" id="panelDash" hidden>
    <div class="dash-top">
      <div><h2 data-i="dashTitle"></h2><p class="hint" style="margin:0" data-i="dashHint"></p></div>
      <div><label for="dRange" data-i="dRange"></label><select id="dRange"></select></div>
    </div>
    <table class="tally four" aria-label="Key figures"><tbody><tr id="dStats"></tr></tbody></table>
    <p class="empty" id="dEmpty" hidden></p>
    <div id="dCharts">
      <div class="chartbox"><h3 data-i="cTrend"></h3><div class="cv"><canvas id="chTrend"></canvas></div></div>
      <div class="two">
        <div class="chartbox"><h3 data-i="cGroup"></h3><div class="cv short"><canvas id="chGroup"></canvas></div></div>
        <div class="chartbox"><h3 data-i="cDept"></h3><div class="cv short"><canvas id="chDept"></canvas></div></div>
      </div>
    </div>
  </section>

  <!-- RECORDS & REPORTS -->
  <section class="panel" id="panelList" hidden>
    <h2 data-i="listTitle"></h2>
    <p class="hint" data-i="listHint"></p>

    <div class="filters">
      <div><label for="qSession" data-i="qSession"></label><select id="qSession"></select></div>
      <div><label for="qFrom" data-i="qFrom"></label><input type="date" id="qFrom"></div>
      <div><label for="qTo" data-i="qTo"></label><input type="date" id="qTo"></div>
      <div><label for="qCat" data-i="qCat"></label><select id="qCat"></select></div>
      <div><label for="qSearch" data-i="qSearch"></label><input type="text" id="qSearch"></div>
    </div>

    <table class="tally" aria-label="Summary"><tbody><tr id="tally"></tr></tbody></table>

    <div class="actions" style="margin:0 0 14px">
      <button class="btn pri" type="button" id="xlsBtn" data-i="xls"></button>
      <button class="btn pri" type="button" id="pdfBtn" data-i="pdf"></button>
      <button class="btn" type="button" id="refreshBtn" data-i="refresh"></button>
    </div>

    <div class="scroll">
      <table class="list">
        <thead><tr id="listHead"></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <p class="count" id="count"></p>
  </section>

  <p class="sync" id="sync"></p>
  <footer id="foot"></footer>
</div>

<div class="toast" id="toast" hidden role="status"></div>

};

function uid(){ return 'A' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function dmy(iso){ if(!iso) return ''; const p = String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
const KD = ['អាទិត្យ','ចន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍'];

const ED = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const EM = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const knum = s => String(s).replace(/\d/g, d => '០១២៣៤៥៦៧៨៩'[d]);
function longDate(iso, l){
  const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso || '';
  return l === 'km'
    ? 'ថ្ងៃ' + KD[d.getDay()] + ' ទី' + knum(pad(d.getDate())) + ' ខែ' + KM[d.getMonth()] + ' ឆ្នាំ' + knum(d.getFullYear())
    : ED[d.getDay()] + ', ' + pad(d.getDate()) + ' ' + EM[d.getMonth()] + ' ' + d.getFullYear();
}

/* =====================================================================
   Backend (JSONP over GET — Apps Script has no CORS)
   ===================================================================== */
function jsonp(params){
  return new Promise((resolve, reject) => {
    const cb = '__lic' + Date.now() + Math.floor(Math.random()*1e5);
    const s = document.createElement('script');
    const q = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 20000);
    function done(){ clearTimeout(timer); window[cb] = () => {}; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = CONFIG.GAS_URL + '?' + q + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
function applyOutbox(list){
  const m = new Map(list.map(r => [r.id, r]));
  outbox.forEach(o => { if (o.op === 'save') m.set(o.rec.id, o.rec); else m.delete(o.id); });
  return Array.from(m.values());
}
async function load(){
  if (!CONFIG.GAS_URL){ render(); return; }
  try{
    const r = await jsonp({action:'list'});
    if (!r || !r.ok) throw new Error('bad');
    records = applyOutbox(r.records || []);
    store.set('records', records); loadFailed = false;
  }catch(e){ loadFailed = true; }
  render();
}
async function flush(){
  if (!CONFIG.GAS_URL || flushing || !outbox.length) return;
  flushing = true;
  try{
    while (outbox.length){
      const it = outbox[0], p = {action: it.op};
      if (it.op === 'save'){ p.data = JSON.stringify(it.rec); if (it.edit) p.edit = 1; } else p.id = it.id;
      if (it.pin) p.pin = it.pin;
      const r = await jsonp(p);
      if (r && r.ok){ outbox.shift(); store.set('outbox', outbox); }
      else if (r && r.error === 'PIN'){
        outbox.shift(); store.set('outbox', outbox); pin = '';
        toast(t('pinWrong')); flushing = false; await load(); flushing = true;
      } else throw new Error((r && r.error) || 'error');
    }
  }catch(e){ /* stays in the outbox; retried later */ }
  flushing = false; render();
}
function askPin(){
  if (!CONFIG.GAS_URL) return 'demo';
  if (pin) return pin;
  const v = prompt(t('pinAsk')); if (!v) return '';
  pin = v.trim(); return pin;
}

  const n = norm($('fName').value); if (!n) return;
  const hit = records.filter(r => norm(r.name) === n).sort((a,b) => String(b.sessionDate).localeCompare(a.sessionDate))[0];
  if (hit && !radioVal('cat') && !getDept()) fillPerson(hit);
}
function submit(e){
  e.preventDefault();
  const rec = {
    id: editingId || uid(),
    sessionDate: editingId ? $('fDate').value : todayISO(),   // new entries always take the day of check-in
    name: $('fName').value.trim().replace(/\s+/g,' '),
    sex: radioVal('sex'), category: radioVal('cat'), department: getDept(), participation: radioVal('part'),
    remark: $('fRemark').value.trim(),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
  if (!rec.sessionDate || !rec.name || !rec.category || !rec.department || !rec.participation){ toast(t('needFields')); return; }
  if (records.some(r => r.id !== rec.id && r.sessionDate === rec.sessionDate && norm(r.name) === norm(rec.name))){ toast(t('dup')); return; }
  let p = '';
  if (editingId){
    p = askPin(); if (!p) return;
    const old = records.find(r => r.id === editingId); if (old) rec.createdAt = old.createdAt;
    records = records.map(r => r.id === rec.id ? rec : r);
  } else {
    records.push(rec);
    store.set('profile', {name:rec.name, sex:rec.sex, category:rec.category, department:rec.department});
  }
  store.set('records', records);
  if (CONFIG.GAS_URL){ outbox.push({op:'save', rec, edit: !!editingId, pin: p}); store.set('outbox', outbox); }
  toast(editingId ? t('updated') : t('saved'));
  const wasEdit = !!editingId;
  $('qFrom').value = rec.sessionDate; $('qTo').value = rec.sessionDate; firstRender = false;
  clearForm(true); render(); flush();
  if (wasEdit) showTab('list'); else $('fName').focus();
}
function startEdit(id){
  const r = records.find(x => x.id === id); if (!r) return;
  editingId = id; $('editBar').hidden = false;
  lockDate(false); $('fDate').value = r.sessionDate; $('fName').value = r.name; fillPerson(r); setRadio('part', r.participation || ''); $('fRemark').value = r.remark || '';
  $('saveBtn').textContent = t('saveEdit'); checkDate(); showTab('form'); window.scrollTo({top:0});
}
function removeRec(id){
  const r = records.find(x => x.id === id); if (!r) return;
  if (!confirm(t('confirmDel') + ' ' + r.name + ' (' + dmy(r.sessionDate) + ')?')) return;
  const p = askPin(); if (!p) return;
  records = records.filter(x => x.id !== id); store.set('records', records);
  if (CONFIG.GAS_URL){ outbox.push({op:'delete', id, pin:p}); store.set('outbox', outbox); }
  toast(t('deleted')); render(); flush();
}

/* =====================================================================
   Tabs, records view
   ===================================================================== */
function showTab(which){
  [['form','panelForm','tabForm'],['dash','panelDash','tabDash'],['list','panelList','tabList']].forEach(x => {
    $(x[1]).hidden = x[0] !== which; $(x[2]).setAttribute('aria-selected', x[0] === which);
  });
  if (which === 'dash') renderDash();
}
function sessions(){ return Array.from(new Set(records.map(r => r.sessionDate).filter(Boolean))).sort().reverse(); }
function filtered(){
  const from = $('qFrom').value, to = $('qTo').value, cat = $('qCat').value, q = norm($('qSearch').value);
  return records.filter(r =>
    (!from || r.sessionDate >= from) && (!to || r.sessionDate <= to) && (!cat || r.category === cat) &&
    (!q || norm([r.name, r.department, deptName(r.department), r.remark].join(' ')).includes(q))
  ).sort((a,b) => String(b.sessionDate).localeCompare(a.sessionDate) || catIdx(a.category) - catIdx(b.category) || a.name.localeCompare(b.name));
}
function render(){
  const names = Array.from(new Set(records.map(r => r.name))).sort();
  $('nameList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');

  const ss = sessions();
  if (firstRender && ss.length){ $('qFrom').value = ss[0]; $('qTo').value = ss[0]; firstRender = false; }
  const from = $('qFrom').value, to = $('qTo').value;
  let sel = (!from && !to) ? '' : (from && from === to && ss.includes(from) ? from : '__c');
  $('qSession').innerHTML = `<option value="">${esc(t('allSessions'))}</option>` +
    ss.map(d => `<option value="${d}">${esc(longDate(d, lang))}</option>`).join('') +
    (sel === '__c' ? `<option value="__c">${esc(t('customRange'))}</option>` : '');
  $('qSession').value = sel;
  const cv = $('qCat').value;
  $('qCat').innerHTML = `<option value="">${esc(t('allCats'))}</option>` + CATS.map(c => `<option value="${c.id}">${esc(c[lang])}</option>`).join('');
  $('qCat').value = cv;

  const rows = filtered(), pend = new Set(outbox.filter(o => o.op === 'save').map(o => o.rec.id));
  $('tally').innerHTML = `<td class="tot"><div class="n">${rows.length}</div><div class="l">${esc(t('total'))}</div></td>` +
    CATS.map(c => `<td><div class="n">${rows.filter(r => r.category === c.id).length}</div><div class="l">${esc(c[lang])}</div></td>`).join('');
  $('listHead').innerHTML = ['hNo','hDate','hName','hSex','hCat','hDept','hPart','hRemark','hAct'].map(k => `<th>${esc(t(k))}</th>`).join('');
  $('listBody').innerHTML = rows.length ? rows.map((r,i) => `<tr class="${pend.has(r.id) ? 'pending' : ''}">
      <td>${i+1}</td><td>${dmy(r.sessionDate)}</td><td><b>${esc(r.name)}</b></td><td>${esc(sexName(r.sex))}</td>
      <td>${esc(catOf(r.category)[lang])}</td><td>${esc(deptName(r.department))}</td><td>${esc(partName(r.participation))}</td><td>${esc(r.remark)}</td>
      <td style="white-space:nowrap"><button class="btn sm" data-edit="${esc(r.id)}">${esc(t('edit'))}</button>
      <button class="btn sm del" data-del="${esc(r.id)}">${esc(t('del'))}</button></td></tr>`).join('')
    : `<tr><td colspan="9" class="empty">${esc(t('empty'))}</td></tr>`;
  $('count').textContent = rows.length + ' ' + t('shown');

  const s = $('sync');
  if (!CONFIG.GAS_URL){ s.className = 'sync warn'; s.textContent = t('syncDemo'); }
  else if (outbox.length){ s.className = 'sync warn'; s.textContent = outbox.length + ' ' + t('syncWait'); }
  else if (loadFailed){ s.className = 'sync warn'; s.textContent = t('syncFail'); }
  else { s.className = 'sync ok'; s.textContent = t('syncOk'); }

  if (!$('panelDash').hidden) renderDash();
}

/* =====================================================================
   Dashboard (Chart.js)
   ===================================================================== */
function drawChart(key, cfg){
  if (charts[key]) charts[key].destroy();
  charts[key] = new Chart($(key), cfg);
}
function renderDash(){
  const n = $('dRange').value;
  let ss = sessions().slice().reverse();                 // oldest first
  if (n !== 'all') ss = ss.slice(-Number(n));
  const rs = records.filter(r => ss.includes(r.sessionDate));
  const per = ss.map(d => rs.filter(r => r.sessionDate === d).length);
  const last = per.length ? per[per.length-1] : 0, prev = per.length > 1 ? per[per.length-2] : null;
  const diff = prev === null ? '' : `<div class="d ${last >= prev ? 'up' : 'down'}">${last >= prev ? '▲ +' : '▼ '}${last - prev} ${esc(t('vsPrev'))}</div>`;
  $('dStats').innerHTML =
    `<td class="tot"><div class="n">${last}</div><div class="l">${esc(t('sLatest'))}${ss.length ? ' (' + dmy(ss[ss.length-1]) + ')' : ''}</div></td>` +
    `<td><div class="n">${ss.length ? (rs.length / ss.length).toFixed(1) : 0}</div><div class="l">${esc(t('sAvg'))}</div>${diff}</td>` +
    `<td><div class="n">${new Set(rs.map(r => norm(r.name))).size}</div><div class="l">${esc(t('sUnique'))}</div></td>` +
    `<td><div class="n">${ss.length}</div><div class="l">${esc(t('sSessions'))}</div></td>`;

  const msg = !window.Chart ? t('noChart') : (!ss.length ? t('dashEmpty') : '');
  $('dEmpty').hidden = !msg; $('dEmpty').textContent = msg; $('dCharts').hidden = !!msg;
  if (msg) return;

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 13;
  Chart.defaults.color = '#14213d';
  const grid = '#e3e9f3';

  // 1. trend: stacked columns by group + total line
  const sets = CATS.map(c => ({
    type:'bar', label:c[lang], backgroundColor:c.color, stack:'groups', borderRadius:2, maxBarThickness:56, order:2,
    data: ss.map(d => rs.filter(r => r.sessionDate === d && r.category === c.id).length)
  }));
  sets.push({type:'line', label:t('totalLine'), data:per, stack:'total', order:1, borderColor:'#14213d', backgroundColor:'#14213d',
    borderWidth:2.5, pointRadius:4, pointHoverRadius:6, pointBackgroundColor:'#fff', pointBorderWidth:2.5, tension:.3});
  drawChart('chTrend', {
    data:{labels: ss.map(d => dmy(d).slice(0,5)), datasets: sets},
    options:{
      responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true, beginAtZero:true, ticks:{precision:0}, grid:{color:grid}} },
      plugins:{ legend:{position:'bottom', labels:{usePointStyle:true, boxHeight:8, padding:14}},
        tooltip:{callbacks:{title: items => longDate(ss[items[0].dataIndex], lang)}} }
    }
  });

  // 2. share by group
  const gCounts = CATS.map(c => rs.filter(r => r.category === c.id).length);
  drawChart('chGroup', {
    type:'doughnut',
    data:{labels: CATS.map(c => c[lang]), datasets:[{data:gCounts, backgroundColor:CATS.map(c => c.color), borderColor:'#fff', borderWidth:2}]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'58%',
      plugins:{ legend:{position:'bottom', labels:{usePointStyle:true, boxHeight:8, padding:10}},
        tooltip:{callbacks:{label: c => ' ' + c.label + ': ' + c.parsed + ' (' + (rs.length ? Math.round(c.parsed / rs.length * 100) : 0) + '%)'}} } }
  });

  // 3. attendance by department (top 10)
  const dm = {}; rs.forEach(r => { dm[r.department] = (dm[r.department] || 0) + 1; });
  const top = Object.keys(dm).map(k => [k, dm[k]]).sort((a,b) => b[1] - a[1]).slice(0,10);
  drawChart('chDept', {
    type:'bar',
    data:{labels: top.map(x => deptName(x[0])), datasets:[{data: top.map(x => x[1]), backgroundColor:'#032EA1', borderRadius:2, maxBarThickness:22}]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      scales:{ x:{beginAtZero:true, ticks:{precision:0}, grid:{color:grid}}, y:{grid:{display:false}} },
      plugins:{ legend:{display:false} } }
  });
}

/* =====================================================================
   Excel report (SheetJS, client side)
   ===================================================================== */
function periodText(rows){
  const ds = rows.map(r => r.sessionDate).sort(); const a = $('qFrom').value || ds[0], b = $('qTo').value || ds[ds.length-1];
  return a === b ? longDate(a, 'km') + ' / ' + longDate(a, 'en') : dmy(a) + ' - ' + dmy(b);
}
function exportExcel(){
  if (!window.XLSX){ toast(t('noXlsx')); return; }
  const rows = filtered().slice().sort((a,b) => String(a.sessionDate).localeCompare(b.sessionDate) || catIdx(a.category) - catIdx(b.category) || a.name.localeCompare(b.name));
  if (!rows.length){ toast(t('nothing')); return; }
  const wb = XLSX.utils.book_new();
  const cat2 = id => catOf(id).km + ' / ' + catOf(id).en;
  const head = [
    [CONFIG.HOSPITAL_KM + ' / ' + CONFIG.HOSPITAL_EN],
    [COURSE.km + ' / ' + COURSE.en],
    [COURSE.byKm + ' / ' + COURSE.byEn],
    [both('period') + ': ' + periodText(rows)], []
  ];
  // 1. attendance list
  const a1 = head.concat([['hNo','hDate','hName','hSex','hCat','hDept','hPart','hRemark','hTime'].map(both)]);
  rows.forEach((r,i) => a1.push([i+1, dmy(r.sessionDate), r.name, sexName(r.sex), cat2(r.category), deptName(r.department), part2(r.participation), r.remark,
    r.createdAt ? new Date(r.createdAt).toLocaleString('en-GB') : '']));
  const w1 = XLSX.utils.aoa_to_sheet(a1);
  w1['!cols'] = [6,12,26,8,52,32,24,28,20].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, w1, 'Attendance');
  // 2. summary by session
  const dates = Array.from(new Set(rows.map(r => r.sessionDate))).sort();
  const a2 = head.concat([[both('hDate')].concat(CATS.map(c => c.km + ' / ' + c.en), [both('total'), both('female'), both('pGroup'), both('pPersonal')])]);
  dates.forEach(d => { const rs = rows.filter(r => r.sessionDate === d);
    a2.push([dmy(d)].concat(CATS.map(c => rs.filter(r => r.category === c.id).length), [rs.length, rs.filter(r => r.sex === 'F').length, rs.filter(r => r.participation === 'group').length, rs.filter(r => r.participation === 'personal').length])); });
  const w2 = XLSX.utils.aoa_to_sheet(a2);
  w2['!cols'] = [{wch:12}].concat(CATS.map(() => ({wch:36})), [{wch:26},{wch:14},{wch:18},{wch:22}]);
  XLSX.utils.book_append_sheet(wb, w2, 'Summary');
  // 3. participant x session matrix
  const people = new Map();
  rows.forEach(r => { const k = norm(r.name); if (!people.has(k)) people.set(k, {r, d:{}}); people.get(k).d[r.sessionDate] = 1; });
  const a3 = head.concat([[both('hNo'), both('hName'), both('hCat'), both('hDept')].concat(dates.map(dmy), [both('hSessions')])]);
  Array.from(people.values()).sort((x,y) => catIdx(x.r.category) - catIdx(y.r.category) || x.r.name.localeCompare(y.r.name))
    .forEach((p,i) => a3.push([i+1, p.r.name, cat2(p.r.category), deptName(p.r.department)]
      .concat(dates.map(d => p.d[d] ? '✓' : ''), [dates.filter(d => p.d[d]).length])));
  const w3 = XLSX.utils.aoa_to_sheet(a3);
  w3['!cols'] = [{wch:6},{wch:26},{wch:52},{wch:32}].concat(dates.map(() => ({wch:12})), [{wch:26}]);
  XLSX.utils.book_append_sheet(wb, w3, 'By participant');
  XLSX.writeFile(wb, 'Leadership-Course-Attendance_' + dates[0] + (dates.length > 1 ? '_to_' + dates[dates.length-1] : '') + '.xlsx');
}

/* =====================================================================
   PDF report (browser print)
   ===================================================================== */
function printHead(){
  return `<div class="p-head"><div><img src="${LOGO}" alt="">${CONFIG.PRINT_LEFT.map(esc).join('<br>')}</div><div>ព្រះរាជាណាចក្រកម្ពុជា<br>ជាតិ សាសនា ព្រះមហាក្សត្រ</div></div>
    <div class="p-title"><div class="k">បញ្ជីវត្តមានអ្នកចូលរួម</div><div class="k">${esc(COURSE.km)}</div>
    <div class="e">Attendance List: ${esc(COURSE.en)}</div></div>`;
}
function printSign(){
  return `<div class="p-sign"><div>${esc(CONFIG.PREPARED_KM)}<br>${esc(CONFIG.PREPARED_EN)}<div class="sp"></div></div>
    <div>${esc(CONFIG.APPROVED_KM)}<br>${esc(CONFIG.APPROVED_EN)}<div class="sp"></div></div></div>`;
}
function exportPDF(){
  const rows = filtered(); if (!rows.length){ toast(t('nothing')); return; }
  const dates = Array.from(new Set(rows.map(r => r.sessionDate))).sort();
  const th = k => `<th>${esc(T[k].km)}<br>${esc(T[k].en)}</th>`;
  let html = '';
  if (dates.length > 1){
    html += `<div class="pg">${printHead()}<div class="p-meta"><div><b>${esc(both('period'))}:</b> ${dmy(dates[0])} - ${dmy(dates[dates.length-1])}</div>
      <div>${esc(COURSE.byKm)} / ${esc(COURSE.byEn)}</div></div>
      <table class="p"><thead><tr>${th('hNo')}${th('hDate')}${CATS.map(c => `<th>${esc(c.km)}<br>${esc(c.en)}</th>`).join('')}${th('total')}</tr></thead><tbody>` +
      dates.map((d,i) => { const rs = rows.filter(r => r.sessionDate === d);
        return `<tr><td class="c">${i+1}</td><td class="c">${dmy(d)}</td>${CATS.map(c => `<td class="c">${rs.filter(r => r.category === c.id).length}</td>`).join('')}<td class="c"><b>${rs.length}</b></td></tr>`; }).join('') +
      `</tbody></table>${printSign()}</div>`;
  }
  dates.forEach(d => {
    const rs = rows.filter(r => r.sessionDate === d);
    let n = 0, body = '';
    CATS.concat([{id:'__x', km:'ផ្សេងៗ', en:'Other'}]).forEach(c => {
      const g = rs.filter(r => c.id === '__x' ? catIdx(r.category) === 99 : r.category === c.id).sort((a,b) => a.name.localeCompare(b.name));
      if (!g.length) return;
      body += g.map(r => `<tr><td class="c">${++n}</td><td>${esc(r.name)}</td><td class="c">${esc(sexName(r.sex))}</td>
          <td>${esc(c.id === '__x' ? (r.category || '') : c[lang])}</td><td>${esc(deptName(r.department))}</td><td class="c">${esc(partName(r.participation))}</td><td>${esc(r.remark)}</td></tr>`).join('');
    });
    html += `<div class="pg">${printHead()}
      <div class="p-meta"><div><b>${esc(both('hDate'))}:</b> ${esc(longDate(d,'km'))} / ${esc(longDate(d,'en'))}</div>
      <div>${esc(COURSE.byKm)} / ${esc(COURSE.byEn)} (${esc(both('platform'))})</div>
      <div><b>${esc(both('total'))}:</b> ${rs.length} (${esc(both('female'))}: ${rs.filter(r => r.sex === 'F').length}) &nbsp; ${esc(both('pGroup'))}: ${rs.filter(r => r.participation === 'group').length} &nbsp; ${esc(both('pPersonal'))}: ${rs.filter(r => r.participation === 'personal').length}</div>
      <div><b>${esc(both('hCat'))}:</b> ${CATS.map(c => esc(c[lang]) + ': ' + rs.filter(r => r.category === c.id).length).join(', ')}</div></div>
      <table class="p sess"><thead><tr>${th('hNo')}${th('hName')}${th('hSex')}${th('hCat')}${th('hDept')}${th('hPart')}${th('hRemark')}</tr></thead><tbody>${body}</tbody></table>
      ${printSign()}</div>`;
  });
  $('printArea').innerHTML = html;
  const go = () => window.print();
  (document.fonts && document.fonts.ready) ? document.fonts.ready.then(go) : go();
}

/* =====================================================================
   Start
   ===================================================================== */
buildStatic();
lang = store.get('lang') || 'km';
lockDate(true);
applyLang(); checkDate();
const prof = store.get('profile'); if (prof){ $('fName').value = prof.name || ''; fillPerson(prof); }

$('langBtn').onclick = () => { lang = lang === 'km' ? 'en' : 'km'; store.set('lang', lang); applyLang(); };
$('tabForm').onclick = () => showTab('form');
$('tabDash').onclick = () => showTab('dash');
$('tabList').onclick = () => showTab('list');
$('form').addEventListener('submit', submit);
$('clearBtn').onclick = () => clearForm(false);
$('cancelEdit').onclick = () => { clearForm(false); showTab('list'); };
$('fDate').addEventListener('change', checkDate);
$('fName').addEventListener('change', onName);
$('fDept').addEventListener('change', () => { $('fDeptOther').hidden = $('fDept').value !== '__other'; if (!$('fDeptOther').hidden) $('fDeptOther').focus(); });
$('dRange').addEventListener('change', renderDash);
$('qSession').addEventListener('change', e => { const v = e.target.value; if (v === '__c') return; $('qFrom').value = v; $('qTo').value = v; render(); });
['qFrom','qTo','qCat'].forEach(id => $(id).addEventListener('change', render));
$('qSearch').addEventListener('input', render);
$('xlsBtn').onclick = exportExcel; $('pdfBtn').onclick = exportPDF;
$('refreshBtn').onclick = () => { flush(); load(); };
$('listBody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.edit) startEdit(b.dataset.edit); else if (b.dataset.del) removeRec(b.dataset.del);
});
window.addEventListener('online', flush);
setInterval(flush, 30000);
setInterval(() => { if (!editingId && $('fDate').value !== todayISO()){ lockDate(true); checkDate(); } }, 60000);   // page left open past midnight
load().then(flush);
</script>
